<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>激活码</title>
  <style>
    :root{
      --bg:#ffffff;
      --blue: #1e88e5;
      --muted: #bfbfbf;
      --dash: #e6e6e6;
      --title-color: #222;
      --max-width: 420px;
    }
    html,body{height:100%;margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans","PingFang SC","Microsoft YaHei",sans-serif;color:var(--title-color)}
    .page{min-height:100%;display:flex;flex-direction:column;align-items:stretch}
    .top-space{height:60px;background:linear-gradient(#fafafa,#fafafa)}
    .sep{border-top:1px dashed var(--dash);margin:0 16px}
    .center{display:flex;justify-content:center;align-items:flex-start;padding:18px 16px}
    .card{width:100%;max-width:var(--max-width);text-align:center;padding:28px 12px 36px;margin:0 auto}
    .title{font-size:20px;color:var(--title-color);margin:0 0 12px;font-weight:500}
    .activation{color:var(--blue);font-weight:700;font-size:44px;letter-spacing:2px;margin:8px 0 12px;line-height:1;word-break:break-word}
    .hint{color:#9e9e9e;font-size:13px;margin-bottom:10px}
    .qr-wrap{margin:6px 0 18px;display:flex;justify-content:center}
    .qr-wrap img{width:200px;height:200px;display:block}
    .meta{color:var(--muted);font-size:14px;line-height:2.0;margin-top:6px}
    .bottom-space{height:180px}
    @media (max-width:420px){.activation{font-size:36px}.qr-wrap img{width:180px;height:180px}.card{padding:22px 10px 30px}}
  </style>
</head>
<body>
  <div class="page">
    <div class="top-space"></div>
    <div class="sep" aria-hidden="true"></div>

    <div class="center">
      <div class="card" role="main" aria-labelledby="title">
        <h1 class="title" id="title">请将下面的激活码输入仪器：</h1>

        <div class="activation" id="activationCode">- - - - -</div>
        <div class="hint">(点击激活码可复制)</div>

        <div class="qr-wrap" id="qrContainer" aria-hidden="false"></div>

        <div class="meta" id="metaInfo">
          <div>适配仪器：<span id="snDisplay">-</span></div>
          <div>适配耗材：<span id="codeDisplay">-</span></div>
          <div>操作时间：<span id="tsDisplay">-</span></div>
        </div>
      </div>
    </div>

    <div class="sep" aria-hidden="true"></div>
    <div class="bottom-space"></div>
  </div>

  <script>
    // 常量与前端/Java 算法保持一致（可逆 ri）
    const VERSION = 0xA0;
    const K1 = [0x9E,0xCF,0x40,0x02];
    const K2 = [0xE4,0x50,0x8F,0x97];

    const activationEl = document.getElementById('activationCode');
    const qrContainer = document.getElementById('qrContainer');
    const snEl = document.getElementById('snDisplay');
    const codeEl = document.getElementById('codeDisplay');
    const tsEl = document.getElementById('tsDisplay');

    function pad2(n){ return String(n).padStart(2,'0'); }
    function formatDate(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }
    function hexToBytes(hex){ const out=new Uint8Array(hex.length/2); for(let i=0;i<out.length;i++) out[i]=parseInt(hex.substr(i*2,2),16); return out; }
    function bytesToHexUpper(arr){ return Array.from(arr).map(x=>('0'+(x&0xFF).toString(16)).slice(-2)).join('').toUpperCase(); }
    function bytesToUint32BE(arr,off){ return ((arr[off]&0xFF)<<24)|((arr[off+1]&0xFF)<<16)|((arr[off+2]&0xFF)<<8)|(arr[off+3]&0xFF); }
    function intTo4BytesBE(i){ return new Uint8Array([(i>>24)&0xFF,(i>>16)&0xFF,(i>>8)&0xFF,i&0xFF]); }

    function crc32(buf){
      let table = crc32.table;
      if(!table){ table = crc32.table = new Uint32Array(256); for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++){ c = ((c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1)); } table[i]=c>>>0; } }
      let crc = 0xFFFFFFFF;
      for(let i=0;i<buf.length;i++) crc = (crc >>> 8) ^ table[(crc ^ buf[i]) & 0xFF];
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }

    async function sha1HexUpper(str){ const enc=new TextEncoder().encode(str); const digest=await crypto.subtle.digest('SHA-1',enc); return bytesToHexUpper(new Uint8Array(digest)); }

    function parseRiHex(riHex){
      if(!riHex) return null;
      const h=riHex.trim();
      if(h.length!==26) return null;
      const b=hexToBytes(h);
      if(b.length!==13) return null;
      const ri_sn=b.slice(1,5), ri_code=b.slice(5,9), cs=b.slice(9,13);
      const snb=new Uint8Array(4), codeb=new Uint8Array(4);
      for(let i=0;i<4;i++){ snb[i]=ri_sn[i]^K1[i]; codeb[i]=ri_code[i]^K2[i]; }
      const sn=bytesToUint32BE(snb,0)>>>0, code=bytesToUint32BE(codeb,0)>>>0;
      const prefix=b.slice(0,9), calc=crc32(prefix);
      const csVal=((cs[0]&0xFF)<<24)|((cs[1]&0xFF)<<16)|((cs[2]&0xFF)<<8)|(cs[3]&0xFF);
      const ok=(calc>>>0)==(csVal>>>0);
      return { sn:String(sn), code:String(code), okChecksum:ok };
    }

    function generateRiFromSnCode(snStr, codeStr){
      const sn = Number(snStr)>>>0, code = Number(codeStr)>>>0;
      const out = new Uint8Array(13); out[0]=VERSION;
      const snBytes=intTo4BytesBE(sn), codeBytes=intTo4BytesBE(code);
      for(let i=0;i<4;i++){ out[1+i]=snBytes[i]^K1[i]; out[5+i]=codeBytes[i]^K2[i]; }
      const prefix = out.slice(0,9), crcVal = crc32(prefix);
      out[9]=(crcVal>>>24)&0xFF; out[10]=(crcVal>>>16)&0xFF; out[11]=(crcVal>>>8)&0xFF; out[12]=crcVal&0xFF;
      return bytesToHexUpper(out);
    }

    function getParam(keys){
      const params=new URLSearchParams(window.location.search);
      for(const k of keys) if(params.has(k)) return params.get(k);
      return null;
    }

    (async function(){
      const snParam = (getParam(['sn','SN','Sn'])||'').trim();
      const codeParam = (getParam(['code','CODE','Code'])||'').trim();
      const riParam = (getParam(['ri','RI','Ri'])||'').trim();
      const st = (getParam(['st','ST','St'])||'00').trim();
      let wt = (getParam(['wt','WT','Wt'])||'').trim();
      if(!wt) wt = String(Math.floor(Math.random()*90)+10).slice(-2);

      tsEl.textContent = formatDate(new Date());
      snEl.textContent = snParam || '-';
      codeEl.textContent = codeParam || '-';

      let riUsed = '';
      if(riParam){
        riUsed = riParam.toUpperCase();
        const decoded = parseRiHex(riUsed);
        if(decoded){ if(decoded.sn) snEl.textContent = decoded.sn; if(decoded.code) codeEl.textContent = decoded.code; if(!decoded.okChecksum) console.warn('RI checksum mismatch for', riUsed); }
      } else if(snParam && codeParam){
        riUsed = generateRiFromSnCode(snParam, codeParam);
      } else {
        riUsed = '';
      }

      // clear previous QR
      qrContainer.innerHTML = '';

      if(!riUsed){
        activationEl.textContent = '-';
      } else {
        const sha1hex = await sha1HexUpper(riUsed + '|' + st + '|' + wt);
        const code18 = sha1hex.slice(0,18);
        const groups = [ code18.slice(0,4), code18.slice(4,8), code18.slice(8,12), code18.slice(12,16), code18.slice(16,18) ];
        const formatted = groups.join(' ').trim();
        activationEl.textContent = formatted;

        activationEl.style.cursor = 'pointer';
        activationEl.addEventListener('click', function(){
          navigator.clipboard?.writeText(formatted).then(()=> {
            const old = this.textContent; this.textContent = '已复制: ' + formatted;
            setTimeout(()=> this.textContent = formatted, 1500);
          }).catch(()=>{});
        });

        // QR now encodes the activation code text itself (per request)
        const qrPayload = formatted; // activation code string
        const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(qrPayload);
        const img = document.createElement('img');
        img.src = qrUrl; img.alt = 'QR'; img.width = 240; img.height = 240;
        qrContainer.appendChild(img);
      }
    })();
  </script>
</body>
</html>
